<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Screening Agent console for frontline hiring: screening, interview booking, recruiter review, candidate requests, fairness checks and audit records.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Screening Agent Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: operations console. A left rail lists the workflow stages in order, the working area sits on the right. On phones the rail becomes a scrolling strip at the top. */
:root{
  --bg:#F2F3EF; --surface:#FFFFFF; --surface-2:#E9ECE6; --ink:#16201C; --ink-2:#47534D; --ink-3:#6E7973; --line:#D7DCD4;
  --accent:#1E5A46; --accent-ink:#FFFFFF; --accent-soft:#DCEAE2;
  --good:#2B7A4B; --good-soft:#DDEFE2; --warn:#8F5A05; --warn-soft:#F5E7C8; --bad:#B0382B; --bad-soft:#F6DED9; --info:#2D5A8C; --info-soft:#DDE7F2;
  --chat:#E7E2D7; --b-in:#FFFFFF; --b-out:#D5ECCB; --shadow:0 1px 2px rgba(20,30,25,.06),0 6px 24px rgba(20,30,25,.08);
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif; --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101513; --surface:#171E1B; --surface-2:#202925; --ink:#E4EAE6; --ink-2:#A9B4AE; --ink-3:#85918B; --line:#2D3833;
  --accent:#72C2A1; --accent-ink:#0C1914; --accent-soft:#1B3A2E;
  --good:#79C996; --good-soft:#18331F; --warn:#E2AE4E; --warn-soft:#3A2D12; --bad:#EF8676; --bad-soft:#3F1F1A; --info:#8FB7E6; --info-soft:#1A2A3D;
  --chat:#1A201D; --b-in:#26302B; --b-out:#22412F; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101513; --surface:#171E1B; --surface-2:#202925; --ink:#E4EAE6; --ink-2:#A9B4AE; --ink-3:#85918B; --line:#2D3833;
  --accent:#72C2A1; --accent-ink:#0C1914; --accent-soft:#1B3A2E;
  --good:#79C996; --good-soft:#18331F; --warn:#E2AE4E; --warn-soft:#3A2D12; --bad:#EF8676; --bad-soft:#3F1F1A; --info:#8FB7E6; --info-soft:#1A2A3D;
  --chat:#1A201D; --b-in:#26302B; --b-out:#22412F; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:26px;font-weight:700}
h2{font-size:17px;font-weight:600}
h3{font-size:14px;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);gap:20px;max-width:1440px;margin:0 auto}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px}
.mark{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;flex:none}
.brand b{font-family:var(--f-display);font-size:15px;display:block;line-height:1.2}
.brand span{font-size:12px;color:var(--ink-3)}
nav.steps{display:flex;flex-direction:column;gap:2px}
nav.steps a{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;color:var(--ink-2);text-decoration:none;font-weight:500}
nav.steps a .ix{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
nav.steps a:hover{background:var(--surface-2);color:var(--ink)}
nav.steps a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
nav.steps a[aria-current="page"] .ix{color:var(--accent)}
.badge{font-size:11px;font-weight:600;background:var(--warn-soft);color:var(--warn);border-radius:20px;padding:1px 7px;font-variant-numeric:tabular-nums}
.rail .ws{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.main{min-width:0;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.top .grp{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.clock{font-family:var(--f-mono);font-size:12.5px;background:var(--surface-2);padding:4px 8px;border-radius:6px}
.chip-sample{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border:1px dashed var(--ink-3);color:var(--ink-2);padding:2px 8px;border-radius:20px}
select,input[type=text],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
textarea{width:100%;resize:vertical}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn-pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-pri:hover{filter:brightness(1.08);border-color:var(--accent)}
.btn-bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn-sm{padding:3px 9px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.page-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px 16px}
.page-h p{max-width:72ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0;display:flex;flex-direction:column;gap:12px}
.card-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .l{font-size:12px;color:var(--ink-2)}
.kpi .s{font-size:11.5px;color:var(--ink-3)}
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl td.r,.tbl th.r{text-align:right}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-good{background:var(--good-soft);color:var(--good)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-info{background:var(--info-soft);color:var(--info)}
.p-acc{background:var(--accent-soft);color:var(--accent)}
.sbar{display:flex;align-items:center;gap:8px;min-width:120px}
.sbar .t{flex:1;height:6px;background:var(--surface-2);border-radius:4px;position:relative;overflow:visible}
.sbar .f{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--accent)}
.sbar .th{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink-3)}
.sbar b{font-variant-numeric:tabular-nums;width:24px;text-align:right}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.list{display:flex;flex-direction:column}
.list .it{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)} .dot.good{background:var(--good)} .dot.info{background:var(--info)}
.funnel{display:flex;flex-direction:column;gap:10px}
.funnel .row{display:grid;grid-template-columns:170px 1fr 56px;gap:10px;align-items:center}
.funnel .bar{height:22px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.funnel .bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.funnel .row:nth-child(n+3) .bar i{background:color-mix(in srgb,var(--accent) 75%,var(--surface))}
.flow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.flow a{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--ink);background:var(--surface-2);border-radius:8px;padding:10px;min-width:0}
.flow a:hover{background:var(--accent-soft)}
.flow a .ix{font-family:var(--f-mono);font-size:11px;color:var(--accent)}
.flow a b{font-size:13px;font-weight:600}
.flow a span{font-size:12px;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--ink-2)}
.chip.x{text-decoration:line-through;text-decoration-color:var(--ink-3)}
.kv{display:grid;grid-template-columns:minmax(110px,45%) minmax(0,1fr);gap:6px 16px;font-size:13px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;min-width:0}
.crit{display:grid;grid-template-columns:minmax(0,1fr) 120px 48px;gap:4px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.crit:last-child{border-bottom:0}
.crit .ev{grid-column:1 / -1;font-size:12.5px;color:var(--ink-2)}
.meter{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.note{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:10px 12px}
.note.warn{background:var(--warn-soft);color:var(--ink)}
.note.good{background:var(--good-soft);color:var(--ink)}
.tl{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:4px}
.tl .ev{position:relative;padding:0 0 12px 14px;font-size:13px}
.tl .ev::before{content:"";position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--ink-3)}
.tl .ev.agent::before{border-color:var(--accent)} .tl .ev.human::before{border-color:var(--info)} .tl .ev.candidate::before{border-color:var(--warn)}
.tl .ev .w{font-size:11.5px;color:var(--ink-3)}
.drawer-bg,.modal-bg{position:fixed;inset:0;background:rgba(10,16,13,.42);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--bg);z-index:41;overflow-y:auto;box-shadow:var(--shadow);padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) 20px;display:flex;flex-direction:column;gap:14px}
.modal{position:fixed;z-index:51;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,calc(100% - 32px));max-height:calc(100% - 48px);overflow:auto;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px}
.modal-bg{z-index:50}
.modal pre,.modal textarea.code{font-family:var(--f-mono);font-size:12px;background:var(--surface-2);border-radius:8px;padding:12px;max-height:56vh;overflow:auto;white-space:pre;margin:0;border:0}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-size:13px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.msg-layout{display:grid;grid-template-columns:minmax(0,300px) minmax(0,380px) minmax(0,1fr);gap:16px;align-items:start}
.conv{max-height:640px;overflow-y:auto}
.conv .it{cursor:pointer;padding:9px 8px;border-radius:6px;grid-template-columns:1fr auto}
.conv .it[aria-current="true"]{background:var(--accent-soft)}
.phone{width:100%;max-width:380px;border-radius:28px;border:8px solid var(--ink);background:var(--chat);overflow:hidden;display:flex;flex-direction:column;height:640px;margin:0 auto}
.phone .ph{background:var(--accent);color:var(--accent-ink);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.phone .ph b{font-size:14px} .phone .ph span{font-size:11.5px;opacity:.85}
.phone .body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:84%;padding:7px 10px 5px;border-radius:10px;font-size:13px;white-space:pre-wrap;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.bub.out{background:var(--b-in);align-self:flex-start;border-top-left-radius:2px}
.bub.in{background:var(--b-out);align-self:flex-end;border-top-right-radius:2px}
.bub .tm{display:block;text-align:right;font-size:10.5px;color:var(--ink-3);margin-top:2px}
.phone .replies{padding:10px;background:var(--surface);display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid var(--line)}
.phone .replies .lab{width:100%;font-size:11px;color:var(--ink-3)}
.status-page{background:var(--surface);flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.status-page .hero{border-radius:10px;padding:14px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px}
.status-page .bigbtn{width:100%;justify-content:center;padding:10px}
.gate{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.gate:last-child{border-bottom:0}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.switch:last-child{border-bottom:0}
.switch input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.switch .d{font-size:12px;color:var(--ink-3)}
input[type=range]{accent-color:var(--accent);width:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hbars{display:flex;flex-direction:column;gap:8px}
.hbars .r{display:grid;grid-template-columns:110px 1fr 60px;gap:10px;align-items:center;font-size:12.5px}
.stack{display:flex;height:18px;border-radius:4px;overflow:hidden;background:var(--surface-2)}
.stack i{display:block;height:100%}
.empty{padding:24px;text-align:center;color:var(--ink-3)}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.flow{grid-template-columns:repeat(4,minmax(0,1fr))}.msg-layout{grid-template-columns:minmax(0,280px) minmax(0,1fr)}.msg-layout .slots{grid-column:1 / -1}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;gap:10px}
  nav.steps{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  nav.steps a{grid-template-columns:auto auto auto;white-space:nowrap}
  .rail .ws{display:none}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .msg-layout{grid-template-columns:minmax(0,1fr)}
  .conv{max-height:260px}
}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.flow{grid-template-columns:repeat(2,minmax(0,1fr))}.funnel .row{grid-template-columns:110px 1fr 48px}h1{font-size:22px}.phone{height:560px}}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>


<div class="app">
  <aside class="rail">
    <div class="brand"><div class="mark">SA</div><div><b>Screening Agent</b><span>Recruit module</span></div></div>
    <nav class="steps" id="nav" aria-label="Workflow"></nav>
    <div class="ws">
      <div class="eyebrow">Workspace</div>
      <div><b>Kestrel Retail &amp; Logistics</b></div>
      <div class="muted">5 open jobs · India, United States, Germany</div>
      <div class="faint">Every rejection based on judgment is made by a person. The agent only closes applications that fail a requirement the candidate stated, where the country rules allow it.</div>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <div class="grp">
        <span class="chip-sample">Sample data</span>
        <span class="clock" id="clock"></span>
      </div>
      <div class="grp">
        <label class="faint" for="who">Signed in as</label>
        <select id="who"></select>
        <button class="btn btn-sm" data-act="intake" id="btn-intake">Receive 10 applications</button>
        <button class="btn btn-sm" data-act="advance24" id="btn-adv">Advance clock 24h</button>
        <button class="btn btn-sm" data-act="askReset">Reset workspace</button>
      </div>
    </header>
    <div id="view" class="main"></div>
  </div>
</div>
<div id="drawerBg" class="drawer-bg" hidden data-act="closeDrawer"></div>
<aside id="drawer" class="drawer" hidden aria-label="Candidate detail"></aside>
<div id="modalBg" class="modal-bg" hidden data-act="closeModal"></div>
<div id="modal" class="modal" hidden role="dialog" aria-modal="true"></div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
'use strict';
const H=3600e3, MIN=60e3, D=24*H;
const BASE_NOW=Date.UTC(2026,10,4,9,30);
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const pad=n=>String(n).padStart(2,'0');
const fmtT=t=>{const d=new Date(t);return `${DAYS[d.getUTCDay()]} ${d.getUTCDate()} ${MON[d.getUTCMonth()]}, ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`};
const fmtD=t=>{const d=new Date(t);return `${d.getUTCDate()} ${MON[d.getUTCMonth()]} ${d.getUTCFullYear()}`};
const iso=t=>new Date(t).toISOString().replace('.000','');
function dur(ms){ms=Math.abs(ms);if(ms<60e3)return Math.max(1,Math.round(ms/1000))+' s';if(ms<90*MIN)return Math.round(ms/MIN)+' min';if(ms<48*H)return Math.round(ms/H)+' h';return Math.round(ms/D)+' d'}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function makeSlots(req){
  const times={IN:[[10,0],[12,30],[15,0],[17,30]],US:[[9,0],[13,0],[16,30]],DE:[[9,30],[13,30],[15,30]]}[req.country];
  const cap=req.country==='IN'?6:4; const out=[];
  for(let d=0;d<14;d++){
    const day=Date.UTC(2026,9,30)+d*D; const wd=new Date(day).getUTCDay();
    if(wd===0) continue;
    times.forEach(([h,m],i)=>out.push({id:`${req.id.slice(-3)}-${d}-${i}`,t:day+h*H+m*MIN,cap,booked:0}));
  }
  return out;
}

function genCand(req,rnd){
  const pk=a=>a[Math.floor(rnd()*a.length)];
  const co=req.country;
  const age40=rnd()<0.3;
  const sexR=rnd();
  const sex=sexR<0.07?'Not stated':(sexR<(req.kind==='driver'?0.3:0.5)?'Woman':'Man');
  const pT=age40?0.3:0.12;
  let r=rnd(),type;
  if(r<pT)type='transferable';else if(r<pT+0.36)type='direct';else if(r<pT+0.62)type='adjacent';else type='none';
  if(age40&&type==='none'&&rnd()<0.5)type='adjacent';
  const months=3+Math.floor(rnd()*30), years=2+Math.floor(rnd()*9);
  let text,gloss=null;
  const arg=type==='transferable'?years:months;
  if(co==='DE'){const [de,en]=pk(EXP_DE[type])(arg);text=de;gloss=en}else{text=pk(EXP[req.kind][type])(arg)}
  r=rnd(); let nS=r<0.06?0:r<0.38?1:r<0.72?2:3;
  const shifts=[...req.shifts].sort(()=>rnd()-0.5).slice(0,nS);
  const startDays=pk([3,5,7,7,10,14,14,21,30,45]);
  r=rnd(); let cert=null,certCredit=req.kind==='driver'?0.2:0;
  const cl=CERTS[req.kind];
  if(r<0.24){cert=cl[0][0];certCredit=cl[0][1]}else if(r<0.58){cert=cl[1][0];certCredit=cl[1][1]}
  r=rnd(); const lang=r<0.76?'yes':r<0.95?'some':'no';
  const ans={rtw:rnd()>0.05,age:rnd()>0.02,licence:req.kind==='driver'?rnd()>0.1:true,shifts,startDays,lang,cert};
  return {exp:{type,months,years,text,gloss},ans,certCredit,demo:{sex,age:age40?'40 and over':'Under 40'}};
}

/* ---------------- scoring ---------------- */
function credit(c,key,mv){
  switch(key){
    case 'exp':{const e=c.exp;if(e.type==='direct')return Math.max(.5,Math.min(1,e.months/12));if(e.type==='adjacent')return .6;if(e.type==='transferable')return mv==='v1.2'?.3:.75;return .1}
    case 'shift':return [0,.5,.8,1][Math.min(3,c.ans.shifts.length)];
    case 'start':{const d=c.ans.startDays;return d<=7?1:d<=14?.7:d<=30?.4:.1}
    case 'cert':return c.certCredit;
    case 'lang':return c.ans.lang==='yes'?1:c.ans.lang==='some'?.5:0;
  }
  return 0;
}
function evidence(c,key,mv){
  const e=c.exp, a=c.ans;
  switch(key){
    case 'exp':
      if(e.type==='direct')return `Direct experience: ${e.months} months in the same kind of work.`;
      if(e.type==='adjacent')return `Related experience: ${e.months} months in a nearby role. Partial credit.`;
      if(e.type==='transferable')return mv==='v1.2'?`Wording did not match a known job title. Low credit.`:`Mapped to transferable skills (stock handling, counts, cash or driving duties) over ${e.years} years.`;
      return 'No paid work described.';
    case 'shift':return a.shifts.length?`Available for ${a.shifts.length} of 3 shifts: ${a.shifts.join(', ')}.`:'No offered shift selected.';
    case 'start':return `Can start in ${a.startDays} days.`;
    case 'cert':return a.cert?`${a.cert}.`:'None listed.';
    case 'lang':return a.lang==='yes'?'Yes, said they can follow briefings.':a.lang==='some'?'Some understanding, said they may need help.':'Said they cannot yet.';
  }
  return '';
}
function scoreWith(c,crit,mv){
  let tot=0,ws=0;
  const br=crit.map(k=>{const cr=credit(c,k.key,mv);tot+=k.w*cr;ws+=k.w;return {key:k.key,label:k.label,w:k.w,credit:cr,ev:evidence(c,k.key,mv)}});
  return {score:ws?Math.round(tot/ws*100):0,br};
}
function koWith(c,kos){
  return kos.filter(k=>k.on).map(k=>{
    let pass=true,answer='Yes';
    if(k.key==='rtw'){pass=c.ans.rtw;answer=pass?'Yes':'No'}
    if(k.key==='age'){pass=c.ans.age;answer=pass?'Yes':'No'}
    if(k.key==='shift'){pass=c.ans.shifts.length>0;answer=pass?c.ans.shifts.length+' selected':'None selected'}
    if(k.key==='licence'){pass=c.ans.licence;answer=pass?'Yes':'No'}
    return {key:k.key,label:k.label,need:k.need,needDE:k.needDE,pass,answer};
  });
}

function tpl(c,type,x={}){

    case 'invite':return de?`Gute Nachrichten, ${c.first}: Wir laden Sie zu einem 15-minütigen Gespräch ein. Bitte wählen Sie einen Termin:\n${s.map((x,i)=>`${i+1}) ${slotLabel(x,true)}`).join('\n')}\nAntworten Sie 4 für andere Termine.`

    case 'more':return de?`Weitere Termine:\n${s.map((x,i)=>`${i+1}) ${slotLabel(x,true)}`).join('\n')}`:`Here are more times:\n${s.map((x,i)=>`${i+1}) ${slotLabel(x)}`).join('\n')}`;
    case 'booked':return de?`Gebucht: ${slotLabel(x.slot,true)}, ${r.site}. Bitte bringen Sie einen Ausweis mit. Antworten Sie R zum Verschieben oder C zum Absagen.`:`Booked: ${slotLabel(x.slot)} at ${r.site}. Please bring a photo ID. Reply R to reschedule or C to cancel.`;
    case 'reminder':return de?`Erinnerung: Ihr Gespräch ist am ${slotLabel(x.slot,true)}. Antworten Sie R zum Verschieben.`:`Reminder: your interview for ${r.title} is on ${slotLabel(x.slot)}. Reply R to reschedule.`;
    case 'ko':{const f=x.fail;return de?`Danke, ${c.first}. Für diese Stelle ist erforderlich, dass Sie ${f.map(k=>k.needDE).join(' und ')}. Laut Ihren Angaben trifft das nicht zu. Falls das ein Versehen ist, antworten Sie innerhalb von 24 Stunden mit ÄNDERN.`
      :`Thanks, ${c.first}. This role needs someone who ${f.map(k=>k.need).join(' and ')}. Your answers say you don't. If that is a mistake, reply CHANGE within 24 hours and we will recheck.`}
    case 'changed':return de?`Danke, wir haben Ihre Angabe aktualisiert und Ihre Bewerbung erneut geprüft.`:`Thanks. We have updated your answer and rechecked your application.`;
    case 'rej_rule':return `Hi ${c.first}, we have closed your application for ${r.title} because the role needs someone who ${x.fail.map(k=>k.need).join(' and ')}. If you think this is wrong, a person will review it: ${statusLink(c)}. You can also see the data we hold about you there.`;
    case 'rej_human':return de?`Hallo ${c.first}, vielen Dank für Ihre Bewerbung als ${r.title}. Unser Recruiting-Team hat Ihre Bewerbung persönlich geprüft. Wir können Ihnen diesmal leider kein Gespräch anbieten. Hauptgrund: ${REASONS[x.reason].de}. Erneute Prüfung oder Auskunft über Ihre Daten: ${statusLink(c)}`
      :`Hi ${c.first}, thank you for applying for ${r.title}. A recruiter reviewed your application and we won't be moving forward this time. Main reason: ${REASONS[x.reason].en}. To ask for another review or see your data: ${statusLink(c)}`;
    case 'stop':return de?`Sie erhalten keine weiteren Nachrichten. Eine Recruiterin oder ein Recruiter meldet sich ggf. telefonisch.`:`You will not get more messages from us. A recruiter may call you about your application.`;
    case 'cancel':return de?`Ihr Termin wurde abgesagt. Viel Erfolg weiterhin!`:`Your interview is cancelled and your application is withdrawn. Good luck.`;
    case 'review_upheld':return `Hi ${c.first}, a recruiter has looked at your application again and the decision stands. Thank you for asking. Your data stays available at ${statusLink(c)} until it is deleted.`;
    case 'reopened':return de?`Hallo ${c.first}, wir haben Ihre Bewerbung erneut geöffnet. Sie hören innerhalb von 48 Stunden von uns.`:`Hi ${c.first}, we have reopened your application after another review. You will hear from us within 48 hours.`;
  }
  return '';
}

function log(t,c,event,actorType,actor,detail,extra){
  S.seq.l++;
  const r=c?R(c.req):(extra&&extra.req?R(extra.req):null);
  S.log.push({id:'EV-'+String(S.seq.l).padStart(6,'0'),t,cid:c?c.id:null,req:r?r.id:null,co:r?r.country:null,event,actorType,actor,detail,mv:c?(c.modelV||S.model):S.model,cv:r?r.criteriaVersion:null});
}

/* ---------------- workflow ---------------- */
function intake(c,t){
  const r=R(c.req),p=S.policy[r.country];
  c.receivedAt=t;
  log(t,c,'Application received','candidate','Candidate',`Applied via ${c.source}. Notice ${p.noticeVersion} shown before submit.`);
  const tA=t+(35+Math.floor(rand()*80))*1000;
  c.ackAt=tA;
  out(c,tA,tpl(c,'ack'));
  log(tA,c,'Acknowledgment sent','agent',AGENT,`${r.channel}. Includes automated screening notice.`);
  screen(c,tA+(20+Math.floor(rand()*40))*1000);
}
function screen(c,t){
  const r=R(c.req),p=S.policy[r.country];
  const sc=scoreWith(c,r.criteria,S.model);
  c.score=sc.score;c.br=sc.br;c.ko=koWith(c,r.knockouts);c.modelV=S.model;c.critV=r.criteriaVersion;c.screenedAt=t;c.threshold=r.threshold;
  const fail=c.ko.filter(k=>!k.pass);
  if(fail.length){
    c.band='ko';c.status='correction';c.windowEnds=t+p.correctionHours*H;
    out(c,t,tpl(c,'ko',{fail}));
    log(t,c,'Hard requirement not met','agent',AGENT,`${fail.map(f=>f.label).join('; ')}. Candidate asked to confirm. Window ${p.correctionHours} h.`);
  } else if(sc.score>=r.threshold){
    c.band='advance';
    log(t,c,'Screened: interview band','agent',AGENT,`Score ${sc.score}, line ${r.threshold}. Criteria v${r.criteriaVersion}, model ${S.model}.`);
    if(p.autoInvite) invite(c,t,'agent',AGENT,'Score at or above the interview line');
    else {c.status='review';c.dueBy=c.receivedAt+p.slaHours*H}
  } else {
    c.band='review';c.status='review';c.dueBy=c.receivedAt+p.slaHours*H;
    log(t,c,'Screened: sent to recruiter','agent',AGENT,`Score ${sc.score}, line ${r.threshold}. Score alone never closes an application.`);
  }
}
function nextSlots(reqId,after,n,exclude){
  exclude=exclude||[];
  return S.slots[reqId].filter(s=>s.t>=after&&s.booked<s.cap&&!exclude.includes(s.id)).sort((a,b)=>a.t-b.t).slice(0,n);
}
function invite(c,t,aType,actor,basis){
  const sl=nextSlots(c.req,t+18*H,3);
  c.offered=sl.map(s=>s.id);c.status='invited';c.invitedAt=t;
  if(!c.decidedAt)c.decidedAt=t;
  c.decision={outcome:'advance',by:aType,actor,at:t,basis};
  out(c,t,tpl(c,'invite',{slots:sl}));
  log(t,c,'Interview invitation sent',aType,actor,`${R(c.req).channel}. ${sl.length} times offered. Basis: ${basis}.`);
}
function slotById(c,id){return S.slots[c.req].find(s=>s.id===id)}
function book(c,s,t){
  s.booked++;c.slot=s.id;c.status='booked';c.bookedAt=t;
  out(c,t,tpl(c,'booked',{slot:s}));
  log(t,c,'Interview booked','candidate','Candidate',`${slotLabel(s)} at ${R(c.req).site}.`);
}
function reply(c,raw,t){
  const txt=String(raw).trim().toUpperCase();
  inc(c,t,raw);
  const t2=t+20e3;
  if(txt==='STOP'){c.optedOut=true;c.thread.push({d:'out',t:t2,text:tpl(c,'stop')});log(t2,c,'Opted out of messages','candidate','Candidate','Recruiter to contact by phone if needed.');return}
  if((txt==='CHANGE'||txt==='ÄNDERN')&&c.status==='correction'){
    c.ans.rtw=true;c.ans.age=true;c.ans.licence=true;if(!c.ans.shifts.length)c.ans.shifts=[R(c.req).shifts[0]];
    log(t,c,'Candidate corrected an answer','candidate','Candidate','Answer changed inside the correction window.');
    out(c,t2,tpl(c,'changed'));screen(c,t2+10e3);return;
  }
  if(c.status==='invited'){
    if(['1','2','3'].includes(txt)){
      const s=slotById(c,c.offered[+txt-1]);
      if(s&&s.booked<s.cap){book(c,s,t2);return}
      const sl=nextSlots(c.req,t+18*H,3);c.offered=sl.map(x=>x.id);out(c,t2,tpl(c,'more',{slots:sl}));return;
    }
    if(txt==='4'){
      const last=slotById(c,c.offered[c.offered.length-1]);
      const sl=nextSlots(c.req,(last?last.t:t)+1,3,c.offered);c.offered=sl.map(x=>x.id);out(c,t2,tpl(c,'more',{slots:sl}));
      log(t2,c,'More interview times offered','agent',AGENT,'Candidate asked for other times.');return;
    }
  }
  if(c.status==='booked'){
    if(txt==='R'){const s=slotById(c,c.slot);if(s)s.booked--;c.slot=null;const sl=nextSlots(c.req,t+18*H,3,[s&&s.id]);c.offered=sl.map(x=>x.id);c.status='invited';out(c,t2,tpl(c,'more',{slots:sl}));log(t2,c,'Reschedule requested','candidate','Candidate','Slot released, new times offered.');return}
    if(txt==='C'){const s=slotById(c,c.slot);if(s)s.booked--;c.slot=null;c.status='withdrawn';out(c,t2,tpl(c,'cancel'));log(t2,c,'Candidate withdrew','candidate','Candidate','Interview cancelled by candidate.');return}
  }
}
function reject(c,t,aType,actor,basis,x){
  const p=P(c);
  c.status='rejected';c.decidedAt=c.decidedAt||t;c.rejectedAt=t;
  c.decision={outcome:'reject',by:aType,actor,at:t,basis,reason:x.reason||null,note:x.note||''};
  c.retainUntil=t+p.retentionDays*D;
  if(aType==='agent'){out(c,t,tpl(c,'rej_rule',{fail:c.ko.filter(k=>!k.pass)}));
    log(t,c,'Application closed: requirement not met','agent',AGENT,`Rule-based. ${basis}. Candidate did not correct within window.`);
    if(rand()<p.sampleRate){S.samples.push({id:'QA-'+(++S.seq.q),cid:c.id,t,status:'open'});log(t,c,'Picked for second-look sample','system','Quality sampling',`${Math.round(p.sampleRate*100)}% of rule-based closures are checked by a person.`)}
  } else {
    out(c,t,tpl(c,'rej_human',{reason:x.reason}));
    log(t,c,'Rejected by recruiter','human',actor,`${REASONS[x.reason].label}.${x.note?' Note: '+x.note:''} Candidate notified with review link.`);
  }
}
function closeWindow(c,t){
  const p=P(c);const fail=c.ko.filter(k=>!k.pass);
  if(p.autoRejectKO) reject(c,t,'agent',AGENT,fail.map(f=>f.label).join('; '),{});
  else {c.status='confirm';c.dueBy=t+24*H;log(t,c,'Closure held for a person to confirm','system','Country rules',`${COUNTRY[R(c.req).country]}: a person confirms every rejection.`)}
}
function humanAdvance(c,t,u){
  log(t,c,'Advanced by recruiter','human',u.name,c.band==='review'?`Score ${c.score} was below the line. Recruiter judgment.`:'Recruiter moved candidate forward.');
  c.status='new';invite(c,t+15e3,'human',u.name,'Recruiter decision');
}
function humanConfirm(c,t,u){
  log(t,c,'Rejection confirmed by recruiter','human',u.name,'Reviewed hard-requirement answer before closing.');
  const p=P(c);c.status='rejected';c.decidedAt=c.decidedAt||t;c.rejectedAt=t;c.retainUntil=t+p.retentionDays*D;
  c.decision={outcome:'reject',by:'human',actor:u.name,at:t,basis:'Hard requirement not met, confirmed by a person',reason:null};
  const r=R(c.req);const fail=c.ko.filter(k=>!k.pass);
  out(c,t+10e3,r.country==='DE'?`Hallo ${c.first}, wir haben Ihre Bewerbung als ${r.title} persönlich geprüft. Leider erfüllen Sie laut Ihren Angaben eine Voraussetzung nicht (${fail.map(f=>f.needDE).join(', ')}). Erneute Prüfung oder Auskunft über Ihre Daten: ${statusLink(c)}`:tpl(c,'rej_rule',{fail}));
}
function suggestReason(c){
  const b=[...c.br].sort((a,b)=>(a.credit*a.w-a.w)-(b.credit*b.w-b.w))[0];
  return b&&REASONS[b.key]?b.key:'exp';
}
function bookingFollowUp(c,from,now){
  if(c.status!=='invited'||c.optedOut)return;
  const tb=from+(0.4+rand()*8)*H;
  if(tb<now&&rand()<0.8){reply(c,String(1+Math.floor(rand()*Math.min(3,c.offered.length))),tb)}

function interviewFollowUp(c,now,from){
  if(c.status!=='booked')return;
  const s=slotById(c,c.slot);if(!s)return;
  const tr=s.t-24*H;
  if(tr<=now&&tr>(from||0)&&tr>c.bookedAt){out(c,tr,tpl(c,'reminder',{slot:s}));log(tr,c,'Reminder sent','agent',AGENT,'24 hours before interview.')}
  if(s.t+H<=now){
    if(rand()<0.86){c.status='interviewed';log(s.t+40*MIN,c,'Interview attended','human',R(c.req).hm,'Hiring manager notes added in Recruit. Handed to offer stage.')}
    else{c.status='noshow';log(s.t+40*MIN,c,'Did not attend interview','human',R(c.req).hm,'Agent will offer one new time.')}
  }
}

function seedFollow(c){

      if(c.status==='confirm'&&now-c.windowEnds>3*H&&rand()<0.6)humanConfirm(c,c.windowEnds+(1+rand()*2)*H,recruiterFor('DE'));}
  }
  if(c.status==='invited')bookingFollowUp(c,c.invitedAt,now);
  if(c.status==='review'){
    const td=c.receivedAt+(5+rand()*26)*H;
    if(td<now&&rand()<0.74){

/* ---------------- backtest (historic pool, deterministic) ---------------- */
let BT=null;
function backtest(){
  if(BT)return BT;
  const rnd=mulberry32(77031);
  const pool=[];
  const crit=CRITERIA;
  REQS.forEach(r=>{
    const n={IN:1700,US:1300,DE:900}[r.country]*(r.n/40);
    for(let i=0;i<n;i++){
      const g=genCand(r,rnd);
      const q=({direct:.95,transferable:.85,adjacent:.6,none:.12})[g.exp.type]*credit(g,'shift')*(g.ans.startDays<=14?1:.6);
      const hired=g.ans.rtw&&g.ans.age&&g.ans.licence&&g.ans.shifts.length>0&&rnd()<q*0.16;
      const ko=!(g.ans.rtw&&g.ans.age&&g.ans.licence&&g.ans.shifts.length>0);
      pool.push({co:r.country,demo:g.demo,hired,ko,s12:scoreWith(g,crit,'v1.2').score,s13:scoreWith(g,crit,'v1.3').score});
    }
  });
  const hires=pool.filter(p=>p.hired);
  const low=(k)=>hires.filter(h=>h[k]<50).length;
  const band=(k)=>{const o={adv:0,rev:0,low:0};hires.forEach(h=>{if(h[k]>=70)o.adv++;else if(h[k]>=50)o.rev++;else o.low++});return o};
  function impact(k,co){
    const ps=pool.filter(p=>(!co||p.co===co)&&!p.ko);
    const groups={'Women':p=>p.demo.sex==='Woman','Men':p=>p.demo.sex==='Man','Under 40':p=>p.demo.age==='Under 40','40 and over':p=>p.demo.age==='40 and over'};
    const rates={};Object.entries(groups).forEach(([g,f])=>{const m=ps.filter(f);rates[g]={n:m.length,sel:m.filter(p=>p[k]>=70).length}});
    const out=[];
    [['Women','Men'],['Under 40','40 and over']].forEach(pair=>{const rs=pair.map(g=>rates[g].n?rates[g].sel/rates[g].n:0);const mx=Math.max(...rs);pair.forEach((g,i)=>out.push({g,n:rates[g].n,rate:rs[i],ratio:mx?rs[i]/mx:1}))});
    return out;
  }
  BT={pool:pool.length,hires:hires.length,low12:low('s12'),low13:low('s13'),b12:band('s12'),b13:band('s13'),impact};
  return BT;
}

function kpis(list){
  const L=list||S.cands;
  const ack=median(L.map(c=>c.ackAt-c.receivedAt));
  const elig=L.filter(c=>c.decidedAt||S.now-c.receivedAt>=48*H);
  const within=elig.filter(c=>c.decidedAt&&c.decidedAt-c.receivedAt<=48*H);
  const decided=L.filter(c=>c.decidedAt);
  const medDec=median(decided.map(c=>c.decidedAt-c.receivedAt));
  const booked=L.filter(c=>['booked','interviewed','noshow'].includes(c.status)).length;
  const review=L.filter(c=>c.status==='review');
  const overdue=review.filter(c=>c.dueBy<S.now).length;
  const ruleRej=L.filter(c=>c.status==='rejected'&&c.decision.by==='agent').length;
  const humRej=L.filter(c=>c.status==='rejected'&&c.decision.by==='human').length;
  const autoAdv=L.filter(c=>c.decision&&c.decision.outcome==='advance'&&c.decision.by==='agent').length;
  const humAdv=L.filter(c=>c.decision&&c.decision.outcome==='advance'&&c.decision.by==='human').length;
  return {n:L.length,ack,within:pct(within.length,elig.length),eligN:elig.length,medDec,booked,review:review.length,overdue,ruleRej,humRej,autoAdv,humAdv,
    passed:L.filter(c=>c.band!=='ko').length,advanced:autoAdv+humAdv,interviewed:L.filter(c=>c.status==='interviewed').length,
    ko:L.filter(c=>c.band==='ko').length,confirm:L.filter(c=>c.status==='confirm').length,correction:L.filter(c=>c.status==='correction').length};
}

function preview(r,d){
  const L=S.cands.filter(c=>c.req===r.id);
  const inBand=(crit,thr,kos)=>L.filter(c=>koWith(c,kos).every(k=>k.pass)&&scoreWith(c,crit,S.model).score>=thr).length;
  const before=pct(inBand(r.criteria,r.threshold,r.knockouts),L.length);
  const after=pct(inBand(d.criteria,d.threshold,d.knockouts),L.length);
  const toInvite=L.filter(c=>c.status==='review'&&scoreWith(c,d.criteria,S.model).score>=d.threshold).length;
  const koClear=L.filter(c=>c.status==='correction'&&koWith(c,d.knockouts).every(k=>k.pass)).length;
  return {before,after,toInvite,koClear};
}

function liveImpact(){
  return ['IN','US','DE'].map(co=>{
    const L=S.cands.filter(c=>R(c.req).country===co&&c.band!=='ko');
    const g={'Women':c=>c.demo.sex==='Woman','Men':c=>c.demo.sex==='Man','Under 40':c=>c.demo.age==='Under 40','40 and over':c=>c.demo.age==='40 and over'};
    const sel=c=>c.decision&&c.decision.outcome==='advance';
    const rows=[];[['Women','Men'],['Under 40','40 and over']].forEach(pr=>{const rs=pr.map(k=>{const m=L.filter(g[k]);return {k,n:m.length,r:m.length?m.filter(sel).length/m.length:0}});const mx=Math.max(...rs.map(x=>x.r));rs.forEach(x=>rows.push(Object.assign(x,{ratio:mx?x.r/mx:1})))});
    return {co,rows};
  });
}

    return [
      ['Past hires scoring below 50 is 2% or less',`${lowP(bt.low13)}%`,bt.low13/bt.hires<=0.02],

  };
  const hm={id:'H-25-0871',exp:{type:'transferable',years:6,months:0,text:"Ran the stockroom of my family's grocery shop for 6 years. Received stock from distributors, kept counts, checked expiry dates"},ans:{shifts:['Morning','Evening'],startDays:7,lang:'yes',cert:null},certCredit:0};

      <div class="note ${mv==='v1.2'?'warn':'good'}">${mv==='v1.2'?`Under the pilot model, ${b.low} past hires scored below 50. If the bottom of the pile had been closed automatically, these people would never have reached an interview.`:`With transferable-skills mapping, ${b.low} past hires score below 50, down from ${bt.b12.low}. Still not low enough to close anything on score alone.`}</div>

    ${L.slice(0,200).map(e=>`<tr ${e.cid?`class="click" data-act="record" data-id="${e.cid}"`:''}><td class="mono faint" style="white-space:nowrap">${fmtT(e.t)}</td><td><b>${esc(e.event)}</b></td><td class="mono">${e.cid||'-'}</td><td><span class="pill ${e.actorType==='agent'?'p-acc':e.actorType==='human'?'p-info':e.actorType==='candidate'?'p-warn':''}">${esc(e.actor)}</span></td><td class="muted" style="min-width:220px">${esc(e.detail)}</td><td class="mono faint" style="white-space:nowrap">${e.cv?'c'+e.cv+' · ':''}${e.mv}</td></tr>`).join('')}
    </tbody></table></div>
    ${L.length>200?`<p class="faint">Showing the latest 200. Use filters or the CSV export for more.</p>`:''}
  </section>`;
}

  ${admin?'':`<div class="note warn">You are signed in as ${esc(me().name)}. Switch to Sam Okafor, TA admin, to change country rules.</div>`}
  <div class="grid3">${['IN','US','DE'].map(co=>{const p=S.policy[co];return `<section class="card">
    <div class="card-h"><h2>${COUNTRY[co]}</h2><span class="mono faint">notice ${p.noticeVersion}</span></div>
    <label class="switch"><div><div>Invite the interview band automatically</div><div class="d">Candidates at or above the line get times straight away</div></div><input type="checkbox" data-in="pol" data-co="${co}" data-k="autoInvite" ${p.autoInvite?'checked':''} ${admin?'':'disabled'}></label>
    <label class="switch"><div><div>Close applications that fail a stated requirement</div><div class="d">${co==='DE'?'Off: a person confirms every closure':'After a 24-hour correction window, with 10% second looks'}</div></div><input type="checkbox" data-in="pol" data-co="${co}" data-k="autoRejectKO" ${p.autoRejectKO?'checked':''} ${admin&&co!=='DE'?'':'disabled'}></label>
    <label class="switch"><div><div>Close applications on score</div><div class="d">Locked until the gates in Fairness and quality pass</div></div><input type="checkbox" disabled></label>

  </section>`}).join('')}</div>`;
}

/* ---------------- modal / toast ---------------- */
function modal(title,body,content){
  $('#modal').innerHTML=`<div class="card-h"><h2>${esc(title)}</h2><button class="btn btn-sm" data-act="closeModal">Close</button></div>${body?`<div class="muted">${body}</div>`:''}${content!=null?`<textarea class="code" id="mtext" rows="18" readonly>${esc(content)}</textarea><div class="row-actions"><button class="btn btn-pri" data-act="copy">Copy</button><span class="faint" id="copymsg"></span></div>`:''}`;
  $('#modal').hidden=false;$('#modalBg').hidden=false;
}
function closeModal(){$('#modal').hidden=true;$('#modalBg').hidden=true}
let tt=null;
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,3600)}

function decisionRecord(c){
  const r=R(c.req),p=S.policy[r.country];
  return {
    record_id:'DR-'+c.id.slice(2),candidate_ref:c.id,requisition:{id:r.id,title:r.title,site:r.site,country:r.country},
    received_at:iso(c.receivedAt),first_reply_at:iso(c.ackAt),notice_version:p.noticeVersion,channel:r.channel,
    criteria_version:c.critV,model_version:c.modelV,
    inputs_used:['screening answers','described work experience','shift availability','start date','certificates','site language answer'],
    inputs_excluded:EXCLUDED,
    hard_requirements:c.ko.map(k=>({requirement:k.label,candidate_answer:k.answer,met:k.pass})),
    score:{value:c.score,interview_line:c.threshold,breakdown:c.br.map(b=>({criterion:b.label,weight:b.w,credit:+b.credit.toFixed(2),points:Math.round(b.credit*b.w),evidence:b.ev}))},
    band:c.band,status:c.status,
    decision:c.decision?{outcome:c.decision.outcome,decided_by:c.decision.by==='agent'?'automated rule':'person',actor:c.decision.actor,basis:c.decision.basis,reason:c.decision.reason?REASONS[c.decision.reason].label:null,at:iso(c.decision.at)}:null,
    messages_sent:c.thread.filter(m=>m.d==='out').length,messages_received:c.thread.filter(m=>m.d==='in').length,opted_out:c.optedOut,
    candidate_requests:S.requests.filter(q=>q.cid===c.id).map(q=>({id:q.id,type:q.type,raised:iso(q.t),due:iso(q.due),status:q.status,outcome:q.outcome})),
    events:S.log.filter(e=>e.cid===c.id).sort((a,b)=>a.t-b.t).map(e=>({id:e.id,at:iso(e.t),event:e.event,by:e.actor,actor_type:e.actorType,detail:e.detail})),
    retain_until:c.retainUntil?iso(c.retainUntil):'decision pending'
  };
}
function auditorPack(){
  const k=kpis();const bt=backtest();
  return {
    generated_at:iso(S.now),workspace:'Kestrel Retail & Logistics',generated_by:me().name,
    scope:{applications:k.n,period:`${fmtD(Math.min(...S.cands.map(c=>c.receivedAt)))} to ${fmtD(S.now)}`},
    decisions:{invited_by_agent_rule:k.autoAdv,invited_by_person:k.humAdv,closed_by_requirement_rule:k.ruleRej,closed_by_person:k.humRej,closed_on_score_alone:0,awaiting_person:k.review+k.confirm},
    speed:{median_first_reply:dur(k.ack),decided_within_48h_pct:k.within},
    criteria:S.reqs.map(r=>({job:r.id,title:r.title,current_version:r.criteriaVersion,interview_line:r.threshold,criteria:r.criteria.map(c=>({criterion:c.label,weight:c.w})),hard_requirements:r.knockouts.filter(x=>x.on).map(x=>x.label),history:r.history.map(h=>({version:h.v,at:iso(h.t),published_by:h.by,approved_by:h.hm,note:h.note}))})),
    excluded_from_scoring:EXCLUDED,
    model:{live:'v1.3',backtest:{hires:bt.hires,below_50_v12:bt.low12,below_50_v13:bt.low13},impact_ratios_v13:['IN','US','DE'].map(co=>({country:co,groups:bt.impact('s13',co).map(x=>({group:x.g,applicants:x.n,rate:+x.rate.toFixed(3),ratio:+x.ratio.toFixed(2)}))}))},
    country_rules:Object.fromEntries(Object.entries(S.policy).map(([co,p])=>[co,{auto_invite:p.autoInvite,auto_close_failed_requirement:p.autoRejectKO,close_on_score:false,correction_window_h:p.correctionHours,recruiter_sla_h:p.slaHours,second_look_rate:p.sampleRate,data_request_days:p.dataDays,retention_days:p.retentionDays,notice:p.noticeVersion,signoffs:p.signoffs.map(s=>({item:s[0],status:s[1]}))}])),
    second_looks:{checked:S.samples.filter(s=>s.status!=='open').length,agreed:S.samples.filter(s=>s.status==='agree').length,open:S.samples.filter(s=>s.status==='open').length},
    candidate_requests:S.requests.map(q=>({id:q.id,type:q.type,raised:iso(q.t),due:iso(q.due),status:q.status,resolved:q.resolvedAt?iso(q.resolvedAt):null})),
    sample_records:[S.cands.find(c=>c.decision&&c.decision.by==='agent'&&c.status==='rejected'),S.cands.find(c=>c.decision&&c.decision.by==='human'&&c.status==='rejected'),S.cands.find(c=>c.decision&&c.decision.outcome==='advance')].filter(Boolean).map(decisionRecord)
  };
}
function csv(){
  const rows=[['event_id','time_utc','candidate','job','country','event','actor_type','actor','detail','criteria_version','model_version']];
  S.log.slice().sort((a,b)=>a.t-b.t).forEach(e=>rows.push([e.id,iso(e.t),e.cid||'',e.req||'',e.co||'',e.event,e.actorType,e.actor,e.detail,e.cv||'',e.mv]));
  return rows.map(r=>r.map(v=>/[",\n]/.test(String(v))?`"${String(v).replace(/"/g,'""')}"`:v).join(',')).join('\n');
}

/* ---------------- actions ---------------- */
function tick(){S.now+=Math.floor(30+rand()*60)*1000;return S.now}
function need(){if(!canAct()){toast('Read-only access. Switch user at the top to make changes.');return false}return true}
const ACT={
  closeDrawer:()=>closeDrawer(),
  closeModal:()=>closeModal(),
  openCand:el=>openDrawer(el.dataset.id),
  pickJob:el=>{UI.jobReq=el.dataset.id;UI.draft=null;render()},
  resetDraft:()=>{UI.draft=null;render()},
  publishCriteria:()=>{
    if(!need())return;const r=R(UI.jobReq),d=UI.draft;const t=tick();const u=me();
    r.criteria=d.criteria.map(k=>Object.assign({},k));r.knockouts=d.knockouts.map(k=>Object.assign({},k));r.threshold=d.threshold;r.criteriaVersion++;
    r.history.push({v:r.criteriaVersion,t,by:u.name,hm:r.hm,note:d.note.trim()});
    log(t,null,`Criteria v${r.criteriaVersion} published`,'human',u.name,`${r.title}. ${d.note.trim()} Approved by ${r.hm}.`,{req:r.id});
    let moved=0,cleared=0;
    S.cands.filter(c=>c.req===r.id).forEach(c=>{
      if(c.status==='review'){const before=c.status;screen(c,t+5e3);if(c.status!==before)moved++;else c.dueBy=c.receivedAt+S.policy[r.country].slaHours*H}
      else if(c.status==='correction'&&koWith(c,r.knockouts).every(k=>k.pass)){screen(c,t+5e3);cleared++}
    });
    UI.draft=null;render();toast(`Published v${r.criteriaVersion}. ${moved} moved to interview, ${cleared} cleared a requirement.`);
  },
  advance:el=>{if(!need())return;const c=C(el.dataset.id);humanAdvance(c,tick(),me());render();refreshDrawer();toast(`${c.name} invited. Times sent by ${R(c.req).channel}.`)},
  showReject:el=>{UI.candPanel=el.dataset.id;refreshDrawer()},
  cancelReject:()=>{UI.candPanel=null;refreshDrawer()},
  doReject:el=>{if(!need())return;const c=C(el.dataset.id);const reason=$('#rj-reason').value,note=$('#rj-note').value.trim();reject(c,tick(),'human',me().name,'Recruiter review',{reason,note});UI.candPanel=null;render();refreshDrawer();toast(`${c.name} notified with the reason and a review link.`)},
  confirmReject:el=>{if(!need())return;const c=C(el.dataset.id);humanConfirm(c,tick(),me());render();refreshDrawer();toast('Closure confirmed and logged under your name.')},
  toReview:el=>{if(!need())return;const c=C(el.dataset.id);const t=tick();c.status='review';c.band='review';c.dueBy=t+24*H;log(t,c,'Sent to recruiter review','human',me().name,'Closure not confirmed. Full review requested.');render();refreshDrawer();toast('Moved to the review queue.')},
  rtab:el=>{UI.reviewTab=el.dataset.id;UI.sel.clear();render()},
  rtabGo:el=>{UI.reviewTab=el.dataset.id},
  bulkAdvance:()=>{if(!need())return;if(!UI.sel.size){toast('Select at least one application first.');return}const u=me();let n=0;UI.sel.forEach(id=>{const c=C(id);if(c&&c.status==='review'){humanAdvance(c,tick(),u);n++}});UI.sel.clear();render();toast(`${n} invited to interview.`)},
  bulkReject:()=>{if(!need())return;if(!UI.sel.size){toast('Select at least one application first.');return}const u=me();const reason=$('#bulk-reason').value;let n=0;UI.sel.forEach(id=>{const c=C(id);if(c&&c.status==='review'){reject(c,tick(),'human',u.name,'Recruiter review, batch',{reason});n++}});UI.sel.clear();render();toast(`${n} rejected. Each candidate gets the reason and a review link.`)},
  sampleAgree:el=>{if(!need())return;const s=S.samples.find(x=>x.id===el.dataset.id);s.status='agree';log(tick(),C(s.cid),'Second look: rule was right','human',me().name,`Sample ${s.id}.`);render()},
  sampleDisagree:el=>{if(!need())return;const s=S.samples.find(x=>x.id===el.dataset.id);const c=C(s.cid);const t=tick();s.status='disagree';c.status='review';c.band='review';c.dueBy=t+24*H;log(t,c,'Second look: reopened','human',me().name,`Sample ${s.id}. Rule outcome overturned, counted against the rule.`);out(c,t+10e3,tpl(c,'reopened'));render();toast('Application reopened and the candidate told.')},
  reqUphold:el=>{if(!need())return;const q=S.requests.find(x=>x.id===el.dataset.id);const c=C(q.cid);const t=tick();q.status='done';q.resolvedAt=t;q.resolvedBy=me().name;q.outcome='Decision stands';out(c,t,tpl(c,'review_upheld'));log(t,c,'Human review: decision stands','human',me().name,`Request ${q.id}.`);render()},
  reqReopen:el=>{if(!need())return;const q=S.requests.find(x=>x.id===el.dataset.id);const c=C(q.cid);const t=tick();q.status='done';q.resolvedAt=t;q.resolvedBy=me().name;q.outcome='Reopened';c.status='review';c.band='review';c.dueBy=t+24*H;out(c,t,tpl(c,'reopened'));log(t,c,'Human review: reopened','human',me().name,`Request ${q.id}. Back in the review queue.`);render();toast('Reopened. It is now in the review queue.')},
  reqDelete:el=>{if(!need())return;const q=S.requests.find(x=>x.id===el.dataset.id);const c=C(q.cid);const t=tick();q.status='done';q.resolvedAt=t;q.resolvedBy=me().name;q.outcome='Personal data deleted';c.name='Deleted candidate';c.first='Candidate';c.last='';c.phone='deleted';c.exp.text='[deleted]';c.exp.gloss=null;c.thread=[];log(t,c,'Personal data deleted','human',me().name,`Request ${q.id}. Pseudonymous decision record kept without contact details or free text.`);render();toast('Personal data deleted. The pseudonymous record stays for audit.')},
  reqRetain:el=>{if(!need())return;const q=S.requests.find(x=>x.id===el.dataset.id);const c=C(q.cid);const t=tick();q.status='done';q.resolvedAt=t;q.resolvedBy=me().name;q.outcome=`Kept until ${fmtD(c.retainUntil||t)}, then deleted`;log(t,c,'Deletion scheduled','human',me().name,`Request ${q.id}. Retention period applies. Candidate told the date.`);render()},
  reply:el=>{if(!need())return;const c=C(el.dataset.id);reply(c,el.dataset.v,tick());render()},
  pickMsg:el=>{UI.msgC=el.dataset.id;render()},
  gotoMsg:el=>{UI.msgC=el.dataset.id;closeDrawer();render()},
  gotoCand:el=>{UI.candC=el.dataset.id;closeDrawer();render()},
  candReq:el=>{if(!need())return;const c=C(el.dataset.id);const t=tick();const type=el.dataset.v;
    if(type==='access'){addRequest(c,'access',t,'',true);modal('Data copy shown to the candidate','This is what the candidate sees and can save. The request is logged as served.',JSON.stringify({you_applied_for:R(c.req).title,received:iso(c.receivedAt),your_answers:{shifts:c.ans.shifts,start_in_days:c.ans.startDays,certificates:c.ans.cert,site_language:c.ans.lang},experience_you_wrote:c.exp.text,how_it_was_scored:c.br.map(b=>({criterion:b.label,points:Math.round(b.credit*b.w),of:b.w,why:b.ev})),decision:c.decision?{outcome:c.decision.outcome,by:c.decision.by==='agent'?'a fixed rule':'a recruiter',on:fmtD(c.decision.at)}:'not decided yet',messages:c.thread.map(m=>({at:iso(m.t),from:m.d==='out'?'us':'you',text:m.text})),kept_until:c.retainUntil?fmtD(c.retainUntil):'decided later'},null,2));render();return}
    const txt=type==='human_review'?'Please have a person look at my application again.':'Please delete my data.';
    addRequest(c,type,t,txt);render();toast(type==='human_review'?'Review requested. It is now in the recruiter queue.':'Deletion request sent to the team.')},
  fairModel:el=>{UI.fairModel=el.dataset.id;render()},
  record:el=>{const c=C(el.dataset.id);modal(`Decision record ${'DR-'+c.id.slice(2)}`,'Everything used to reach this outcome, who made each decision, and what the candidate was told.',JSON.stringify(decisionRecord(c),null,2))},
  pack:()=>{modal('Auditor pack',`Built ${fmtT(S.now)} from live records. Copy it into the audit file.`,JSON.stringify(auditorPack(),null,2))},
  csv:()=>{modal('Decision log',`${S.log.length} events, oldest first.`,csv())},
  copy:()=>{const ta=$('#mtext');const done=()=>{$('#copymsg').textContent='Copied'};try{navigator.clipboard.writeText(ta.value).then(done,()=>{ta.focus();ta.select();$('#copymsg').textContent='Selected. Press Ctrl+C or Cmd+C.'})}catch(e){ta.focus();ta.select();$('#copymsg').textContent='Selected. Press Ctrl+C or Cmd+C.'}},
  intake:()=>{if(!need())return;const t0=S.now;let n=0;for(let i=0;i<10;i++){const r=pick(S.reqs);newCandidate(r,rand,t0+i*25e3);n++}S.now=t0+10*25e3+3*MIN;render();const L=S.cands.slice(-10);toast(`10 applications screened. ${L.filter(c=>c.status==='invited').length} invited, ${L.filter(c=>c.status==='review').length} to recruiters, ${L.filter(c=>c.status==='correction').length} asked to confirm an answer.`)},
  advance24:()=>{if(!need())return;
    const from=S.now,to=S.now+24*H;let closed=0,booked=0,held=0;
    S.cands.forEach(c=>{
      if(c.status==='correction'&&c.windowEnds<=to){closeWindow(c,c.windowEnds);if(c.status==='rejected')closed++;else held++}
      if(c.status==='invited'&&!c.optedOut&&rand()<0.55){reply(c,String(1+Math.floor(rand()*Math.min(3,c.offered.length))),from+(1+rand()*20)*H);if(c.status==='booked')booked++}
      interviewFollowUp(c,to,from);
    });
    S.now=to;
    const nn=6+Math.floor(rand()*6);for(let i=0;i<nn;i++)newCandidate(pick(S.reqs),rand,to-Math.floor(rand()*20*H));
    render();toast(`One day later: ${nn} new applications, ${booked} interviews booked, ${closed} closed by rule, ${held} held for a person.`)},
  askReset:()=>modal('Reset workspace','Restore the sample data and clear everything done in this browser. <div class="row-actions" style="margin-top:12px"><button class="btn btn-bad" data-act="doReset">Reset</button><button class="btn" data-act="closeModal">Keep my changes</button></div>',null),
  doReset:()=>{try{localStorage.removeItem(STORE)}catch(e){}seed();UI.sel.clear();UI.draft=null;UI.msgC=null;UI.candC=null;closeModal();closeDrawer();render();toast('Workspace reset to sample data.')}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(!f)return;if(el.tagName!=='A')e.preventDefault();f(el,e)});
document.addEventListener('input',e=>{
  const el=e.target;const k=el.dataset&&el.dataset.in;if(!k)return;
  const rerender=()=>{const id=el.id;const pos=el.selectionStart;render();const n=document.getElementById(id);if(n){n.focus();try{if(pos!=null&&n.setSelectionRange)n.setSelectionRange(pos,pos)}catch(x){}}};
  switch(k){
    case 'weight':UI.draft.criteria[+el.dataset.i].w=+el.value;el.nextElementSibling.textContent=el.value;break;
    case 'thr':UI.draft.threshold=+el.value;el.nextElementSibling.textContent=el.value;break;
    case 'note':UI.draft.note=el.value;rerender();break;
    case 'fQ':UI.q=el.value;rerender();break;
    case 'aQ':UI.auditF.q=el.value;rerender();break;
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='who'){S.user=el.value;closeDrawer();render();toast(`Signed in as ${me().name}`);return}
  const k=el.dataset&&el.dataset.in;if(!k)return;
  switch(k){
    case 'weight':case 'thr':render();break;
    case 'ko':UI.draft.knockouts[+el.dataset.i].on=el.checked;render();break;
    case 'hm':UI.draft.hm=el.checked;render();break;
    case 'fReq':UI.req=el.value;render();break;
    case 'fBand':UI.band=el.value;render();break;
    case 'fStatus':UI.status=el.value;render();break;
    case 'mReq':UI.msgReq=el.value;UI.msgC=null;render();break;
    case 'candPick':UI.candC=el.value;render();break;
    case 'aCo':UI.auditF.co=el.value;render();break;
    case 'aActor':UI.auditF.actor=el.value;render();break;
    case 'sel':if(el.checked)UI.sel.add(el.dataset.id);else UI.sel.delete(el.dataset.id);render();break;
    case 'selAll':S.cands.filter(c=>c.status==='review').forEach(c=>el.checked?UI.sel.add(c.id):UI.sel.delete(c.id));render();break;
    case 'pol':{if(!isAdmin()){render();return}const p=S.policy[el.dataset.co];p[el.dataset.k]=el.checked;log(tick(),null,'Country rule changed','human',me().name,`${COUNTRY[el.dataset.co]}: ${el.dataset.k==='autoInvite'?'automatic invitations':'closing failed requirements'} turned ${el.checked?'on':'off'}.`,{});render();toast('Rule updated and logged.');break}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDrawer()}});
window.addEventListener('hashchange',()=>{closeDrawer();render();window.scrollTo(0,0)});

S=load();
if(!S)seed();
render();
})();
